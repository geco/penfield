[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "penfield"
version = "0.1.6"
description = "Local-first visual browser for your MemPalace memory. Stdlib only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "geco" }]
keywords = ["mempalace", "memory", "visualization", "ai-agents", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
penfield = "penfield:main"

[project.urls]
Homepage = "https://github.com/geco/penfield"
Repository = "https://github.com/geco/penfield"
Issues = "https://github.com/geco/penfield/issues"

[tool.setuptools]
py-modules = ["penfield"]
